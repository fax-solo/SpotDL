name: Build APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5
          echo "SDK components installed"

      - name: Read current version
        id: version
        run: |
          VERSION=$(tr -d ' \n' < VERSION)
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Bump version
        id: bump
        run: |
          VERSION="${{ steps.version.outputs.current }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          COMMIT_MSG="${{ github.event.head_commit.message }}"

          if echo "$COMMIT_MSG" | grep -qi "BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMIT_MSG" | grep -qi "^feat"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped: $VERSION → $NEW_VERSION"

      - name: Write updated VERSION file
        run: echo "${{ steps.bump.outputs.new }}" > VERSION

      - name: Inject version into frontend
        run: |
          cat > frontend/src/lib/version.ts << VERSIONEOF
          export const APP_VERSION: string = '${{ steps.bump.outputs.new }}'
          export const GITHUB_REPO = 'fax-solo/SpotDL'

          export function parseVersion(v: string): { major: number; minor: number; patch: number } | null {
            const parts = v.replace(/^v/i, '').split('.').map(Number)
            if (parts.length !== 3 || parts.some(isNaN)) return null
            return { major: parts[0], minor: parts[1], patch: parts[2] }
          }

          export function isNewerVersion(latest: string, current: string): boolean {
            const l = parseVersion(latest)
            const c = parseVersion(current)
            if (!l || !c) return false
            if (l.major !== c.major) return l.major > c.major
            if (l.minor !== c.minor) return l.minor > c.minor
            return l.patch > c.patch
          }
          VERSIONEOF

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build web assets
        run: npm run build
        working-directory: frontend

      - name: Add Android platform
        run: npx cap add android
        working-directory: frontend

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: frontend

      - name: Inject version into build.gradle
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new }}"
          VERSION_CODE=$(echo "$NEW_VERSION" | awk -F. '{ print ($1 * 1000000) + ($2 * 1000) + $3 }')
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$NEW_VERSION\"/" android/app/build.gradle
          echo "build.gradle: versionCode=$VERSION_CODE versionName=$NEW_VERSION"
        working-directory: frontend

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Generate app icon resources from App icon.png
        run: node generate-icons.mjs
        working-directory: frontend

      - name: Copy icons to Android project
        run: |
          ANDROID_RES="android/app/src/main/res"

          # Remove Capacitor default icon files that conflict with custom ones
          rm -rf "$ANDROID_RES/drawable-v24"
          echo "  Removed default drawable-v24 (Capacitor default icon)"

          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$ANDROID_RES/$dir"
            cp "public/$dir/ic_launcher.png" "$ANDROID_RES/$dir/"
            cp "public/$dir/ic_launcher_round.png" "$ANDROID_RES/$dir/"
            # Remove stale Capacitor foreground pngs that are no longer referenced
            rm -f "$ANDROID_RES/$dir/ic_launcher_foreground.png"
            echo "  Copied $dir icons"
          done
          mkdir -p "$ANDROID_RES/drawable"
          cp public/drawable/ic_launcher_foreground.png "$ANDROID_RES/drawable/"
          echo "  Copied adaptive icon foreground"
          # Also copy to drawable-v24 if generated (overrides Capacitor default vector)
          if [ -d "public/drawable-v24" ]; then
            mkdir -p "$ANDROID_RES/drawable-v24"
            cp public/drawable-v24/ic_launcher_foreground.png "$ANDROID_RES/drawable-v24/"
            echo "  Copied adaptive icon foreground (drawable-v24)"
          fi
          mkdir -p "$ANDROID_RES/values"
          cp public/values/ic_launcher_background.xml "$ANDROID_RES/values/"
          echo "  Copied icon background color"
          mkdir -p "$ANDROID_RES/mipmap-anydpi-v26"
          cp public/mipmap-anydpi-v26/ic_launcher.xml "$ANDROID_RES/mipmap-anydpi-v26/"
          cp public/mipmap-anydpi-v26/ic_launcher_round.xml "$ANDROID_RES/mipmap-anydpi-v26/"
          echo "  Copied adaptive icon XML descriptors"
          echo "All icons copied to Android project"
        working-directory: frontend

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: Rename APK
        run: |
          VERSION="${{ steps.bump.outputs.new }}"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Sinc-${VERSION}.apk"
          echo "APK ready: Sinc-${VERSION}.apk"
        working-directory: frontend/android

      - name: Commit version bump
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add VERSION frontend/src/lib/version.ts
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new }} [skip ci]"
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin HEAD:main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new }}
          name: v${{ steps.bump.outputs.new }}
          body: |
            ## Sinc v${{ steps.bump.outputs.new }}

            ### Changes
            ${{ github.event.head_commit.message }}

            ### Download
            - [Sinc-${{ steps.bump.outputs.new }}.apk](Sinc-${{ steps.bump.outputs.new }}.apk)
          files: frontend/android/app/build/outputs/apk/debug/Sinc-${{ steps.bump.outputs.new }}.apk
