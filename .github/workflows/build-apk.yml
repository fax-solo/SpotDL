name: Build APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read current version
        id: version
        run: |
          VERSION=$(tr -d ' \n' < VERSION)
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Bump version
        id: bump
        run: |
          VERSION="${{ steps.version.outputs.current }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          COMMIT_MSG="${{ github.event.head_commit.message }}"

          if echo "$COMMIT_MSG" | grep -qi "BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMIT_MSG" | grep -qi "^feat"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped: $VERSION → $NEW_VERSION"

      - name: Write updated VERSION file
        run: echo "${{ steps.bump.outputs.new }}" > VERSION

      - name: Inject version into frontend
        run: |
          cat > frontend/src/lib/version.ts << VERSIONEOF
          export const APP_VERSION: string = '${{ steps.bump.outputs.new }}'
          export const GITHUB_REPO = 'fax-solo/SpotDL'

          export function parseVersion(v: string): { major: number; minor: number; patch: number } | null {
            const parts = v.replace(/^v/i, '').split('.').map(Number)
            if (parts.length !== 3 || parts.some(isNaN)) return null
            return { major: parts[0], minor: parts[1], patch: parts[2] }
          }

          export function isNewerVersion(latest: string, current: string): boolean {
            const l = parseVersion(latest)
            const c = parseVersion(current)
            if (!l || !c) return false
            if (l.major !== c.major) return l.major > c.major
            if (l.minor !== c.minor) return l.minor > c.minor
            return l.patch > c.patch
          }
          VERSIONEOF

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build web assets
        run: npm run build
        working-directory: frontend

      - name: Add Android platform
        run: npx cap add android
        working-directory: frontend

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: frontend

      - name: Inject version into build.gradle
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new }}"
          VERSION_CODE=$(echo "$NEW_VERSION" | awk -F. '{ print ($1 * 1000000) + ($2 * 1000) + $3 }')
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$NEW_VERSION\"/" android/app/build.gradle
          echo "build.gradle: versionCode=$VERSION_CODE versionName=$NEW_VERSION"
        working-directory: frontend

      - name: Copy icon resources to Android project
        run: |
          ICON_SRC="public"
          ANDROID_RES="android/app/src/main/res"
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ -f "$ICON_SRC/$dir/ic_launcher.png" ]; then
              cp "$ICON_SRC/$dir/ic_launcher.png" "$ANDROID_RES/$dir/"
              cp "$ICON_SRC/$dir/ic_launcher_round.png" "$ANDROID_RES/$dir/"
            fi
          done
          if [ -f "$ICON_SRC/drawable/ic_launcher_foreground.png" ]; then
            cp "$ICON_SRC/drawable/ic_launcher_foreground.png" "$ANDROID_RES/drawable/"
          fi
          if [ -f "$ICON_SRC/values/ic_launcher_background.xml" ]; then
            cp "$ICON_SRC/values/ic_launcher_background.xml" "$ANDROID_RES/values/"
          fi
          mkdir -p "$ANDROID_RES/mipmap-anydpi-v26"
          cp "$ICON_SRC/mipmap-anydpi-v26/ic_launcher.xml" "$ANDROID_RES/mipmap-anydpi-v26/"
          cp "$ICON_SRC/mipmap-anydpi-v26/ic_launcher_round.xml" "$ANDROID_RES/mipmap-anydpi-v26/"
          echo "Icons copied"
        working-directory: frontend

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: Rename APK
        run: |
          VERSION="${{ steps.bump.outputs.new }}"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/SpotDL-${VERSION}.apk"
          echo "APK ready: SpotDL-${VERSION}.apk"
        working-directory: frontend/android

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add VERSION frontend/src/lib/version.ts
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new }} [skip ci]"
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin HEAD:main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new }}
          name: v${{ steps.bump.outputs.new }}
          body: |
            ## SpotDL v${{ steps.bump.outputs.new }}

            ### Changes
            ${{ github.event.head_commit.message }}

            ### Download
            - [SpotDL-${{ steps.bump.outputs.new }}.apk](SpotDL-${{ steps.bump.outputs.new }}.apk)
          files: frontend/android/app/build/outputs/apk/debug/SpotDL-${{ steps.bump.outputs.new }}.apk
