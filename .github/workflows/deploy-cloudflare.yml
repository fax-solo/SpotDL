name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build web assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply sinc-db --remote
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Pages env vars
        run: |
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/spotify-downloader" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_configs": {
                "production": {
                  "env_vars": {
                    "JWT_SECRET": {
                      "type": "secret_text",
                      "value": "'"$(echo $RANDOM$RANDOM$RANDOM | md5sum | head -c 32)"'"
                    },
                    "GOOGLE_CLIENT_ID": {
                      "type": "plain_text",
                      "value": "'"${{ secrets.VITE_GOOGLE_CLIENT_ID }}"'"
                    }
                  }
                }
              }
            }'

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=spotify-downloader
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
