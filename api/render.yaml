services:
  - type: web
    name: sinc-api
    env: docker
    dockerfilePath: ./Dockerfile
    repo: https://github.com/fax-solo/SpotDL
    branch: main
    healthCheckPath: /api/ping
    disks:
      # WARNING: api/data/ MUST reside on a persistent disk.
      # Without it, ALL user data, download history, admin stats,
      # and the JWT secret fallback are wiped on every redeploy.
      - name: sinc-data
        mountPath: /app/data
        sizeGB: 1
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://spotify-downloader-5v5.pages.dev
      - key: SPOTIFY_REDIRECT_URI
        value: https://sinc-api.onrender.com/api/auth/spotify/callback
