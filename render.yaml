services:
  - type: web
    name: spotdl-api
    runtime: docker
    repo: https://github.com/YOUR_USER/YOUR_REPO
    rootDir: api
    envVars:
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        value: https://spotdl-api.onrender.com/api/auth/spotify/callback
      - key: CLIENT_URL
        value: https://your-frontend.netlify.app
